<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
</head>
<body>
    <h1>To-Do List</h1>
    <form id="taskForm">
        <input type="text" id="taskInput" placeholder="Add new task" required />
        <button type="submit">Add Task</button>
    </form>
    <ul id="taskList"></ul>

    <script>
        const taskForm = document.getElementById('taskForm');
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');

        // Fetch tasks and display them
        function fetchTasks() {
            fetch('/tasks')
                .then(response => response.json())
                .then(data => {
                    taskList.innerHTML = ''; // Clear the list first
                    data.forEach((task, index) => {
                        const li = document.createElement('li');
                        li.textContent = task;
                        const deleteButton = document.createElement('button');
                        deleteButton.textContent = 'Delete';
                        deleteButton.onclick = () => deleteTask(index);
                        li.appendChild(deleteButton);
                        taskList.appendChild(li);
                    });
                });
        }

        // Add new task
        taskForm.addEventListener('submit', function(event) {
            event.preventDefault();
            const task = taskInput.value;
            fetch('/tasks', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ task })
            })
            .then(response => response.json())
            .then(() => {
                fetchTasks(); // Refresh the task list
                taskInput.value = ''; // Clear input field
            });
        });

        // Delete task
        function deleteTask(index) {
            fetch(`/tasks/${index}`, { method: 'DELETE' })
                .then(response => response.json())
                .then(() => fetchTasks()); // Refresh the task list
        }

        // Initial fetch to display tasks
        fetchTasks();
    </script>
</body>
</html>
